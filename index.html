<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Ganci</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🌸 TOKO GANCI 🌸</h1>
    <p>
      Keranjang:
      <span id="jumlah">0</span>
    </p>
  </header>

  <div class="container">

    <div class="card">

      <img src="https://picsum.photos/300?1">

      <h2>Ganci Kucing</h2>

      <p>Rp 15.000</p>

      <button onclick="
        tambah(
          'Ganci Kucing',
          15000,
          'https://picsum.photos/300?1'
        )
      ">
        Tambah
      </button>

    </div>

    <div class="card">

      <img src="https://picsum.photos/300?2">

      <h2>Ganci Pink</h2>

      <p>Rp 20.000</p>

      <button onclick="
        tambah(
          'Ganci Pink',
          20000,
          'https://picsum.photos/300?2'
        )
      ">
        Tambah
      </button>

    </div>

    <div class="card">

      <img src="https://picsum.photos/300?3">

      <h2>Ganci Bintang</h2>

      <p>Rp 18.000</p>

      <button onclick="
        tambah(
          'Ganci Bintang',
          18000,
          'https://picsum.photos/300?3'
        )
      ">
        Tambah
      </button>

    </div>

  </div>

  <div class="cart">

    <h2>🛒 Keranjang</h2>

    <ul id="list"></ul>

    <h3>
      Total:
      Rp <span id="total">0</span>
    </h3>

    <button
      class="checkout"
      onclick="checkout()"
    >
      Checkout
    </button>

  </div>

  <div class="review-box">

    <h2>💬 Kasih Ulasan</h2>

    <input
      type="text"
      id="username"
      placeholder="Username kamu"
    >

    <textarea
      id="review"
      placeholder="Tulis ulasan..."
    ></textarea>

    <button onclick="kirimUlasan()">
      Kirim Ulasan
    </button>

  </div>

  <div class="reviews">

    <h2>⭐ Ulasan Pembeli</h2>

    <div id="listReview"></div>

  </div>

  <script src="script.js"></script>

</body>

</html>
