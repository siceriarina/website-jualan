<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Ganci</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>✨ TOKO GANCI ✨</h1>
  <p>Lucu • Handmade • Murah</p>
</header>

<!-- PRODUK -->
<section class="container">

  <div class="card">
    <img src="ganci1.jpg">
    <h2>Ganci Kuromi</h2>
    <p class="harga">Rp 10.000</p>
    <button onclick="tambah('Ganci Kuromi')">Tambah Keranjang</button>
  </div>

  <div class="card">
    <img src="ganci2.jpg">
    <h2>Ganci Dino</h2>
    <p class="harga">Rp 15.000</p>
    <button onclick="tambah('Ganci Dino')">Tambah Keranjang</button>
  </div>

</section>

<!-- KERANJANG -->
<section class="cart">
  <h2>🛒 Keranjang</h2>
  <ul id="list"></ul>

  <button class="checkout" onclick="checkout()">
    Checkout (Email)
  </button>
</section>

<script src="script.js"></script>
</body>
</html>
