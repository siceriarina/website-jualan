<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Ganci</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>✨ TOKO GANCI ✨</h1>
  <p>Mini Shopee versi kamu 😎</p>
</header>

<section class="container">

  <div class="card">
    <img src="ganci1.jpg">
    <h2>Ganci Kuromi</h2>
    <p>Rp 10.000</p>
    <button onclick="tambah('Ganci Kuromi', 10000)">Tambah</button>
  </div>

  <div class="card">
    <img src="ganci2.jpg">
    <h2>Ganci Dino</h2>
    <p>Rp 15.000</p>
    <button onclick="tambah('Ganci Dino', 15000)">Tambah</button>
  </div>

</section>

<section class="cart">
  <h2>🛒 Keranjang</h2>

  <ul id="list"></ul>

  <h3>Total: Rp <span id="total">0</span></h3>

  <button class="checkout" onclick="checkout()">
    Checkout Email
  </button>
</section>

<script src="script.js"></script>
</body>
</html>
